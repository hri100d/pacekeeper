[package]
name = "pacekeeper-bucket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Token-bucket rate limiting with in-memory, Redis, and Redis Cluster backends"
readme = "README.md"
keywords = ["rate-limiting", "rate-limiter", "token-bucket", "redis"]
exclude = ["/tests"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
pacekeeper-core.workspace = true
redis = { version = "1.7", optional = true, default-features = false }

[features]
default = []

memory = []

redis = [
    "dep:redis",
    "redis?/tokio-comp",
    "redis?/connection-manager",
    "redis?/script",
]

redis-cluster = [
    "dep:redis",
    "redis?/tokio-comp",
    "redis?/cluster-async",
    "redis?/script",
]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
testcontainers = "0.28"