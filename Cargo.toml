[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/fixed",
    "crates/sliding-log",
    "crates/sliding-counter",
    "crates/bucket",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hri100d/pacekeeper"

[workspace.dependencies]
pacekeeper-core = { path = "crates/core", version = "0.2.0" }
pacekeeper-fixed = { path = "crates/fixed", version = "0.2.0" }
pacekeeper-sliding-log = { path = "crates/sliding-log", version = "0.2.0" }
pacekeeper-sliding-counter = { path = "crates/sliding-counter", version = "0.2.0" }
pacekeeper-bucket = {
    path = "crates/bucket",
    version = "0.2.0",
    default-features = false,
}
num-traits = "0.2"

[package]
name = "pacekeeper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Configurable rate limiters with in-memory and Redis backends"
readme = "README.md"
keywords = ["rate-limiting", "rate-limiter", "redis", "token-bucket"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []

fixed = ["dep:pacekeeper-fixed"]
sliding-log = ["dep:pacekeeper-sliding-log"]
sliding-counter = ["dep:pacekeeper-sliding-counter"]

bucket = [
    "dep:pacekeeper-bucket",
    "pacekeeper-bucket/memory",
]

bucket-redis = [
    "dep:pacekeeper-bucket",
    "pacekeeper-bucket/redis",
]

bucket-redis-cluster = [
    "dep:pacekeeper-bucket",
    "pacekeeper-bucket/redis-cluster",
]

all = [
    "fixed",
    "sliding-log",
    "sliding-counter",
    "bucket",
    "bucket-redis",
    "bucket-redis-cluster",
]

[dependencies]
pacekeeper-core.workspace = true

pacekeeper-fixed = { workspace = true, optional = true }
pacekeeper-sliding-log = { workspace = true, optional = true }
pacekeeper-sliding-counter = { workspace = true, optional = true }
pacekeeper-bucket = { workspace = true, optional = true }